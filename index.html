const bins = [
  {min:-1,   max:0.45, c:'#b2182b', l:'Under 45%'},
  {min:0.45, max:0.50, c:'#ef8a62', l:'45–50%'},
  {min:0.50, max:0.55, c:'#d1e5f0', l:'50–55%'},
  {min:0.55, max:0.60, c:'#92c5de', l:'55–60%'},

  {min:0.70, max:2,    c:'#0b3a73', l:'70% +'},
];
const color = v => bins.find(b => v >= b.min && v < b.max).c;
const pct = v => (v*100).toFixed(0) + '%';

const map = L.map('map', {zoomSnap:0.25});
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  attribution:'Basemap © Esri | SA1 boundaries: ABS ASGS 2021', maxZoom:16
}).addTo(map);

const sa1Layer = L.geoJSON(SA1, {
  style: f => ({fillColor:color(f.properties.yes), fillOpacity:0.85, color:'#fff', weight:0.6}),
  onEachFeature: (f, layer) => {
    const p = f.properties;
    layer.bindTooltip(`<b>${pct(p.yes)} Yes</b><br>${p.sa2}<br><span style="opacity:.7">SA1 ${p.sa1}</span>`, {sticky:true, className:'tt'});
    layer.on({
      mouseover: e => e.target.setStyle({weight:2.5, color:'#111'}) && e.target.bringToFront(),
      mouseout:  e => sa1Layer.resetStyle(e.target),
    });
  }
}).addTo(map);

L.geoJSON(ELECT, {style:{fill:false, color:'#222', weight:2.5, dashArray:'6 4'}, interactive:false}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {maxZoom:16, pane:'shadowPane'}).addTo(map);

map.fitBounds(sa1Layer.getBounds(), {padding:[20,20]});

const vals = SA1.features.map(f => f.properties.yes);
const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
const below = vals.filter(v => v < 0.5).length;

const title = L.control({position:'topleft'});
title.onAdd = () => {
  const d = L.DomUtil.create('div','panel title');
  d.innerHTML = `<h1>Preston — referendum Yes vote by SA1</h1>
    <p>Each area is a 2021 ABS Statistical Area 1. Dashed line is the Preston district boundary.</p>`;
  return d;
};
title.addTo(map);
map.zoomControl.setPosition('topright');

const legend = L.control({position:'bottomright'});
legend.onAdd = () => {
  const d = L.DomUtil.create('div','panel legend');
  d.innerHTML = '<h2>Yes vote</h2>' + bins.slice().reverse().map(b => `<div class="row"><i style="background:${b.c}"></i>${b.l}</div>`).join('');
  return d;
};
legend.addTo(map);
</script>
